<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Smart Queue System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="material-symbols-outlined" style="font-size:28px">local_hospital</span> CareFlow
        </a>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/doctors}">Doctors</a>
            <a th:href="@{/admin/departments}">Departments</a>
            <a th:href="@{/admin/patients}">Patients</a>
            <a th:href="@{/admin/reports}">Reports</a>
            <a th:href="@{/admin/settings}">Settings</a>
            <a th:href="@{/admin/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container page">
    <div class="header-bar">
        <h1><span class="material-symbols-outlined text-primary">people</span> Patients</h1>
    </div>

    <form method="get" th:action="@{/admin/patients}" class="mb-2">
        <div class="flex items-center">
            <input type="text" name="search" th:value="${search}" placeholder="Search by name, phone or email" style="max-width:400px">
            <button class="btn btn-secondary" type="submit">
                <span class="material-symbols-outlined" style="font-size:18px">search</span> Search
            </button>
        </div>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Registered</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${patients}">
                <td th:text="${p.patientId}"></td>
                <td>
                    <div class="flex items-center gap-sm">
                        <div class="avatar teal" th:text="${#strings.substring(p.name, 0, 2)}"></div>
                        <span th:text="${p.name}"></span>
                    </div>
                </td>
                <td th:text="${p.phone}"></td>
                <td th:text="${p.email}"></td>
                <td th:text="${p.registeredAt}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
