<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors - Hospital Smart Queue System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="material-symbols-outlined" style="font-size:28px">local_hospital</span> CareFlow
        </a>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/doctors}">Doctors</a>
            <a th:href="@{/admin/departments}">Departments</a>
            <a th:href="@{/admin/patients}">Patients</a>
            <a th:href="@{/admin/reports}">Reports</a>
            <a th:href="@{/admin/settings}">Settings</a>
            <a th:href="@{/admin/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container page">
    <div class="header-bar">
        <h1><span class="material-symbols-outlined text-primary">stethoscope</span> Manage Doctors</h1>
        <a class="btn" th:href="@{/admin/doctors/form}">
            <span class="material-symbols-outlined" style="font-size:18px">person_add</span> Add Doctor
        </a>
    </div>

    <div class="card">
        <table class="table">
            <thead>
            <tr><th>ID</th><th>Code</th><th>Name</th><th>Dept ID</th><th>Specialization</th><th>Queue Cap</th><th>Availability</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${doctors}">
                <td th:text="${d.doctorId}"></td>
                <td th:text="${d.doctorCode}"></td>
                <td>
                    <div class="flex items-center gap-sm">
                        <div class="avatar teal" th:text="${#strings.substring(d.name, 0, 2)}"></div>
                        <span th:text="${d.name}"></span>
                    </div>
                </td>
                <td th:text="${d.departmentId}"></td>
                <td th:text="${d.specialization}"></td>
                <td th:text="${d.maxQueueSize}"></td>
                <td>
                    <span class="badge" th:classappend="${d.computedAvailable ? 'badge-serving' : 'badge-cancelled'}" th:text="${d.computedAvailable ? 'Available' : 'Unavailable'}"></span>
                </td>
                <td>
                    <div class="flex items-center">
                        <a class="btn btn-secondary btn-sm" th:href="@{/admin/doctors/form(id=${d.doctorId})}">
                            <span class="material-symbols-outlined" style="font-size:16px">edit</span> Edit
                        </a>
                        <form method="post" th:action="@{/admin/doctors/toggle}" class="inline-form">
                            <input type="hidden" name="doctorId" th:value="${d.doctorId}">
                            <button class="btn btn-sm" type="submit" th:text="${d.available ? 'Mark Unavailable' : 'Mark Available'}"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
