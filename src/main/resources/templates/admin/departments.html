<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Departments - Hospital Smart Queue System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="material-symbols-outlined" style="font-size:28px">local_hospital</span> CareFlow
        </a>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/doctors}">Doctors</a>
            <a th:href="@{/admin/departments}">Departments</a>
            <a th:href="@{/admin/patients}">Patients</a>
            <a th:href="@{/admin/reports}">Reports</a>
            <a th:href="@{/admin/settings}">Settings</a>
            <a th:href="@{/admin/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container page">
    <div class="header-bar">
        <h1><span class="material-symbols-outlined text-primary">apartment</span> Manage Departments</h1>
    </div>

    <div class="grid grid-2">
        <div class="card">
            <h3><span class="material-symbols-outlined text-primary">add_business</span> Add Department</h3>
            <form method="post" th:action="@{/admin/departments/save}">
                <div class="form-group">
                    <label>Department Code</label>
                    <input type="text" name="departmentCode" required placeholder="e.g. CARD">
                </div>
                <div class="form-group">
                    <label>Department Name</label>
                    <input type="text" name="departmentName" required placeholder="e.g. Cardiology">
                </div>
                <button class="btn" type="submit">
                    <span class="material-symbols-outlined" style="font-size:18px">add</span> Add Department
                </button>
            </form>
        </div>

        <div class="card">
            <h3><span class="material-symbols-outlined text-primary">list</span> Departments</h3>
            <table class="table">
                <thead><tr><th>Code</th><th>Name</th></tr></thead>
                <tbody>
                <tr th:each="d : ${departments}">
                    <td th:text="${d.departmentCode}"></td>
                    <td th:text="${d.departmentName}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
