<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Hospital Smart Queue System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="brand" th:href="@{/}">
            <span class="material-symbols-outlined" style="font-size:28px">local_hospital</span> CareFlow
        </a>
        <div class="nav-links"><a th:href="@{/patient/login}">Login</a></div>
    </div>
</nav>

<div class="login-page">
    <div class="card auth-card">
        <div class="text-center mb-2">
            <span class="material-symbols-outlined text-primary" style="font-size:40px">person_add</span>
        </div>
        <h2 class="text-center mb-2">Patient Registration</h2>
        <div class="alert alert-error" th:if="${error}"><span th:text="${error}"></span></div>
        <div class="alert alert-info" th:if="${info}"><span th:text="${info}"></span></div>

        <form method="post" th:action="@{/patient/register}">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required placeholder="e.g. Aung Aung">
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="text" name="phone" required placeholder="09xxxxxxxxx" pattern="09[0-9]{7,9}" maxlength="11">
                <small class="text-muted">Must start with 09 (Myanmar format, 9-11 digits)</small>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Min 8 characters">
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <span class="material-symbols-outlined" style="font-size:20px">visibility_off</span>
                    </button>
                </div>
                <small class="text-muted">Min 8 chars: uppercase, lowercase, number, and special character</small>
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" placeholder="Re-enter password">
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                        <span class="material-symbols-outlined" style="font-size:20px">visibility_off</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="optional">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="Optional - Region, Township, Street">
                <small class="text-muted">If provided, must be a valid Myanmar address</small>
            </div>
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" name="dateOfBirth" required>
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <select name="gender" required>
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="btn w-full">Register</button>
        </form>
        <p class="text-center mt-2">Already registered? <a th:href="@{/patient/login}">Login</a></p>
    </div>
</div>
<script th:src="@{/js/toggle-password.js}"></script>
</body>
</html>
