# ============================================================
# Hospital Smart Queue System - application configuration
# ============================================================

spring.application.name=hospital-smart-queue-system

# ---- Server ----
server.port=${SERVER_PORT:8080}
server.error.include-message=always
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Flyway (Neon cloud database migrations) ----
# Migrations live in src/main/resources/db/migration (V1__, V2__, ...).
# They run automatically on startup against the Neon data source.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# ---- Jackson ----
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Logging ----
logging.level.com.hospitalqueue=INFO
logging.level.org.flywaydb=INFO
